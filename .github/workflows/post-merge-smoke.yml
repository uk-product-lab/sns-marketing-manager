name: Post-merge smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: post-merge-main
  cancel-in-progress: false

jobs:
  smoke:
    name: quality/post-merge-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.12.14
      - name: Pin npm and check runtime
        run: |
          npm install --global npm@11.12.1
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "11.12.1"
      - name: Install dependencies
        run: >-
          node harness/scripts/ci-quality.mjs --product-root . --gate install
          --fixed-sha "${{ github.sha }}" --output artifacts/ci/install-smoke
      - name: Smoke test
        run: >-
          node harness/scripts/ci-quality.mjs --product-root . --gate smoke
          --fixed-sha "${{ github.sha }}" --output artifacts/ci/smoke
      - name: Check combined upload size without truncating evidence
        id: budget
        if: ${{ always() }}
        run: node harness/scripts/ci-upload-budget.mjs artifacts/ci/install-smoke artifacts/ci/smoke
      - name: Upload bounded smoke evidence including failures
        if: ${{ always() && steps.budget.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post-merge-smoke-${{ github.sha }}
          path: |
            artifacts/ci/install-smoke/
            artifacts/ci/smoke/
          if-no-files-found: error
          retention-days: 1
